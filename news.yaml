# Exa-MA News and Events Configuration
# Events are categorized as: upcoming, recent, or archived
# Types: assembly, conference, training, webinar, workshop, external

events:
  # Upcoming events (displayed as cards)

  - id: opecom-2026-05-07
    type: assembly
    status: upcoming
    title: "NumPEx Operational Committee Meeting"
    date: "2026-05-07"
    location: "COMET Bercy, Paris"
    icon: "users"
    description: >
      Agenda: news and BoD feedback; mid-term evaluation covering programme KPIs,
      international and industrial relations, scientific production, and societal impact;
      training in NumPEx; software production, including the continuation of discussions
      on NumPEx software production and the production and organization for the second
      half of NumPEx.

  - id: amd-numpex-meeting-2026
    type: workshop
    status: archived
    title: "AMD and NumPEx Technical Meeting"
    date: "2026-02-18"
    end_date: "2026-02-19"
    location: "Saclay"
    icon: "microchip"
    description: >
      Two-day coordination meeting between AMD and NumPEx focused on technical exchanges.
      Exa-MA (PC1) contributes a presentation of the project and its objectives, and outlines
      three potential collaboration/pilot tracks with AMD developers across WP1, WP3, and WP5.

  - id: majsc-2026
    type: training
    status: upcoming
    title: "MAJSC 2026: ML & Autodiff in JAX"
    date: "2026-06-08"
    end_date: "2026-06-12"
    location: "IRMA, Université de Strasbourg"
    icon: "brain"
    description: >
      Workshop on Machine Learning and Automatic Differentiation in JAX for Scientific Computing.
      Five-day intensive program covering JAX fundamentals, neural networks (Equinox/Flax),
      automatic differentiation for PDEs (Diffrax), physics-informed neural networks,
      and neural operators. Organized by E. Franck (WP2 leader), V. Michel-Dansac, V. Vigon,
      and A. Musik from IRMA Strasbourg.
    url: "https://majsc2026.pages.math.unistra.fr/"

  - id: anr-numpex-2026
    type: assembly
    status: upcoming
    title: "NumPEx/ANR Meeting"
    date: "2026-06-11"
    icon: "landmark"
    description: >
      Morning session devoted to presentations on the progress of the NumPEx research projects,
      including Exa-MA, followed by questions from the ANR. The afternoon will be set aside for
      discussions between the program's governing body and the ANR.

