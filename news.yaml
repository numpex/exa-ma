  - id: website-refresh-2026
    type: announcement
    status: recent
    title: "Exa-MA Website Refresh"
    date: "2026-01-14"
    icon: "globe"
    description: >
      The Exa-MA project website has been refreshed with updated content and improved navigation.
      New features include detailed work package pages, a comprehensive software stack catalog
      with 16+ open-source packages, team directory with photos, 2025 scientific highlights
      (50× GenEO speedups, 8000 GPU scale on LUMI, neural operator acceleration),
      and streamlined access to deliverables and publications.
    url: "https://numpex.github.io/exa-ma/"
    link_text: "Visit Exa-MA website →"

  - id: sab-2025
    type: assembly
    status: recent
    title: "Scientific Advisory Board Meeting"
    date: "2025-12-09"
    location: "Virtual (Zoom)"
    icon: "clipboard-list"
    description: >
      Presentation of Exa-MA advances and 2025 highlights to the NumPEx Scientific Advisory Board.
      Topics included the 50× GenEO speedup, 8000-GPU LUMI deployment, neural operator acceleration
      (80-200% CPU savings), and CGAL 6.0 urban meshing achievements. Joint session with other NumPEx
      projects showcasing program-wide progress. Interactive session with board members providing feedback
      on project direction and scientific impact.
    time: "11:30am – 2:00pm CET"

  - id: youngpex-2025
    type: workshop
    status: recent
    title: "First YoungPEx General Meeting"
    date: "2025-11-12"
    end_date: "2025-11-14"
    location: "ENSEEIHT, Toulouse"
    icon: "users"
    description: >
      Three-day workshop bringing together young researchers to discuss the future of HPC and open science.
      Topics included sustainable computing with Georges Da Costa (Exa-SoFT), Grid'5000 tutorials,
      energy measurement, and workshops on social and gender equality in science.
      Organized by Thomas Saigre (Exa-MA), Karmijn Hoogveld (Exa-SofT), and other NumPEx members.
    url: "https://numpex.org/the-first-youngpex-general-meeting/"

